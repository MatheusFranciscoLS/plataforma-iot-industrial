spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Chave usada so nos testes (a de producao fica fora daqui)
api.security.token.secret=chave-somente-para-testes-automatizados-0123456789
management.endpoints.web.exposure.include=health
management.health.rabbit.enabled=false

# Nos testes comuns o Hibernate cria o esquema no H2; o MigracoesTest liga o Flyway por conta própria.
spring.flyway.enabled=false
