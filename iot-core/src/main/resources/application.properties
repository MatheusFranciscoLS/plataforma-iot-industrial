spring.application.name=iot-core
# Configurações do Banco de Dados (Prontas para a Nuvem)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/iot_plataforma}
spring.datasource.username=${DB_USER:admin_iot}
spring.datasource.password=${DB_PASS:senha_nova_123}

# Configurações do RabbitMQ (Prontas para a Nuvem)
spring.rabbitmq.addresses=${RABBITMQ_URL:amqp://localhost:5672}
spring.datasource.driver-class-name=org.postgresql.Driver
# Poucas conexões: o banco gratuito limita as conexões e a API roda numa fração de CPU, então um pool grande só gasta memória.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
# A conexão com o banco volta para o pool assim que a consulta termina, não só no fim da resposta HTTP.
spring.jpa.open-in-view=false
# O esquema do banco agora é criado e alterado pelas migrações em src/main/resources/db/migration (Flyway).
# Em um banco que já tem as tabelas (criadas antes pelo Hibernate), o Flyway só marca a versão 1 como feita.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=none
# Mostrar o SQL no log só quando precisar (SHOW_SQL=true)
spring.jpa.show-sql=${SHOW_SQL:false}

# Chave que assina os tokens JWT. Em produção, defina JWT_SECRET (a mesma no gateway Node).
# O valor depois dos dois-pontos é só para rodar local e nos testes e é público: a API avisa no log se ele estiver em uso.
api.security.token.secret=${JWT_SECRET:MinhaChaveSuperSecretaParaAIndustriaIot2026!}
# O token vale 2 horas e o painel o renova sozinho; a sessão, porém, acaba esta quantidade de horas depois do login.
api.security.token.sessao-maxima-horas=${SESSAO_MAXIMA_HORAS:12}

# Opcionais: restringem quem pode chamar a API. Sem valor, ficam como antes (tudo aberto).
# CORS_ORIGINS: endereços do painel separados por vírgula. SENSOR_API_KEY: chave exigida dos sensores.
api.cors.origins=${CORS_ORIGINS:*}
api.sensor.key=${SENSOR_API_KEY:}

# Usuário criado na primeira vez que a API sobe com o banco vazio (demonstração).
# Em produção, defina ADMIN_USUARIO e ADMIN_SENHA.
api.admin.usuario=${ADMIN_USUARIO:admin}
api.admin.senha=${ADMIN_SENHA:senha123}
# Usuário de demonstração (perfil OPERADOR), criado junto. DEMO_USUARIO vazio desliga esse usuário.
api.demo.usuario=${DEMO_USUARIO:demo}
api.demo.senha=${DEMO_SENHA:demo123}

# Proteção do site de demonstração (veja ProtecaoDoDemo): com PROTEGER_USUARIOS=true, o administrador inicial e o demo
# não podem ser apagados nem mudados, ninguém cria administradores e o total de usuários tem teto (MAX_USUARIOS).
demo.proteger-usuarios=${PROTEGER_USUARIOS:false}
demo.max-usuarios=${MAX_USUARIOS:25}

# Limite de tentativas de login (LOGIN_MAX_TENTATIVAS falhas bloqueiam por LOGIN_JANELA_SEGUNDOS)
api.login.max-tentativas=${LOGIN_MAX_TENTATIVAS:5}
api.login.janela-segundos=${LOGIN_JANELA_SEGUNDOS:300}

# Aviso de alertas num chat (Discord, Slack ou outro webhook que aceite JSON). Desligado enquanto ALERTA_WEBHOOK_URL estiver vazia.
# ALERTA_WEBHOOK_PAINEL_URL (opcional) vai no fim da mensagem; ALERTA_WEBHOOK_FUSO escolhe o fuso da hora mostrada.
alerta.webhook-url=${ALERTA_WEBHOOK_URL:}
alerta.webhook-painel-url=${ALERTA_WEBHOOK_PAINEL_URL:}
alerta.webhook-fuso=${ALERTA_WEBHOOK_FUSO:America/Sao_Paulo}

# Atrás da hospedagem (proxy), usa o endereço real de quem chamou, que vem no cabeçalho X-Forwarded-For
server.forward-headers-strategy=framework

# /actuator/health é pública (a hospedagem e o Docker usam). As métricas (/actuator/metrics e /actuator/prometheus)
# só respondem com token de ADMIN. O RabbitMQ fora do ar não derruba a saúde: a API salva as leituras mesmo assim.
management.endpoints.web.exposure.include=health,metrics,prometheus
management.health.rabbit.enabled=false

# Documentação da API: JSON em /v3/api-docs e tela em /swagger-ui.html (públicas, só descrevem as rotas).
# DOCS_ATIVAS=false desliga as duas.
springdoc.api-docs.enabled=${DOCS_ATIVAS:true}
springdoc.swagger-ui.enabled=${DOCS_ATIVAS:true}
springdoc.swagger-ui.tags-sorter=alpha

# Modo demonstração (desligado por padrão): a API gera leituras de teste das 3 máquinas.
# SIMULADOR_ATIVO=true liga; RETENCAO_HORAS=24 apaga leituras com mais de 24 h (0 = nunca apaga).
demo.simulador.ativo=${SIMULADOR_ATIVO:false}
demo.retencao-horas=${RETENCAO_HORAS:0}
