name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes-java:
    name: Testes da API Java
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iot-core

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Rodar os testes
        run: |
          chmod +x mvnw
          ./mvnw -B verify
