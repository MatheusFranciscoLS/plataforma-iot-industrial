name: Docker

# Sobe todos os serviços com o docker-compose e testa o caminho completo:
# simulador -> API Java -> RabbitMQ -> gateway Node -> WebSocket -> painel no navegador (Playwright).
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docker-compose.yml"
      - "**/Dockerfile"
      - "iot-core/**"
      - "observabilidade/**"
      - "servidor-node/**"
      - "simulador-python/**"
      - "painel-react/**"
      - "e2e/**"
      - ".github/workflows/docker.yml"
      - ".github/scripts/**"

permissions:
  contents: read

jobs:
  compose:
    name: Subir tudo com o Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Conferir o docker-compose.yml
        run: |
          docker compose config --quiet
          docker compose --profile observabilidade config --quiet

      - name: Construir as imagens
        run: docker compose build

      - name: Subir os serviços
        run: docker compose up -d

      - name: Esperar a API ficar de pé
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/actuator/health | grep -q '"UP"'; then echo "API no ar"; exit 0; fi
            sleep 3
          done
          echo "A API não ficou de pé a tempo"; exit 1

      - name: Fazer login e conferir que o simulador está enviando leituras
        run: |
          TOKEN=$(curl -fs -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"usuario":"admin","senha":"senha123"}' | jq -r .token)
          test -n "$TOKEN" && test "$TOKEN" != "null"
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"

          # Sem token o histórico precisa ser recusado
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/sensores)" = "401"

          for i in $(seq 1 30); do
            N=$(curl -fs -H "Authorization: Bearer $TOKEN" http://localhost:8080/api/sensores | jq length)
            if [ "$N" -gt 0 ]; then echo "$N leituras no histórico"; exit 0; fi
            sleep 2
          done
          echo "O simulador não enviou nenhuma leitura"; exit 1

      - name: Esperar o gateway conectar no RabbitMQ
        run: |
          for i in $(seq 1 40); do
            if curl -fs http://localhost:3000/saude | grep -q '"ok"'; then echo "Gateway no ar"; exit 0; fi
            sleep 3
          done
          echo "O gateway não conectou no RabbitMQ"; exit 1

      - name: Receber uma leitura em tempo real pelo WebSocket
        run: |
          mkdir /tmp/e2e && cp .github/scripts/e2e-socket.mjs /tmp/e2e/
          cd /tmp/e2e && npm init -y > /dev/null && npm install --silent socket.io-client
          node e2e-socket.mjs

      - name: Esperar o painel ficar de pé
        run: |
          for i in $(seq 1 40); do
            if curl -fs http://localhost:5173 > /dev/null; then echo "Painel no ar"; exit 0; fi
            sleep 3
          done
          echo "O painel não ficou de pé a tempo"; exit 1

      - name: Instalar o Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Instalar o Playwright e o Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Testes no navegador (clica no botão de demonstração e confere as máquinas ao vivo)
        working-directory: e2e
        run: npx playwright test

      - name: Subir o Prometheus e o Grafana (perfil observabilidade)
        run: docker compose --profile observabilidade up -d prometheus grafana

      - name: Conferir que o Prometheus coleta as métricas da API
        run: |
          for i in $(seq 1 40); do
            if curl -fs http://localhost:9090/api/v1/targets | jq -e '.data.activeTargets[] | select(.labels.job=="iot-core" and .health=="up")' > /dev/null; then
              echo "Prometheus coletando a API"; break
            fi
            sleep 3
          done
          curl -fs http://localhost:9090/api/v1/targets | jq -e '.data.activeTargets[] | select(.labels.job=="iot-core" and .health=="up")' > /dev/null
          # as métricas do sistema chegaram (o simulador manda leituras sem parar)
          for i in $(seq 1 30); do
            N=$(curl -fs "http://localhost:9090/api/v1/query?query=sum(iot_leituras_recebidas_total)" | jq -r '.data.result[0].value[1] // "0"')
            if [ "${N%.*}" -gt 0 ]; then echo "$N leituras contadas"; exit 0; fi
            sleep 3
          done
          echo "O Prometheus não viu leituras contadas"; exit 1

      - name: Conferir que o Grafana subiu com o painel pronto
        run: |
          for i in $(seq 1 40); do
            if curl -fs http://localhost:3001/api/health | jq -e '.database=="ok"' > /dev/null; then echo "Grafana no ar"; break; fi
            sleep 3
          done
          curl -fs http://localhost:3001/api/health | jq -e '.database=="ok"' > /dev/null
          # o painel "Plataforma IoT" foi carregado da pasta observabilidade/
          curl -fs -u admin:admin "http://localhost:3001/api/search?query=Plataforma" | jq -e '.[] | select(.uid=="plataforma-iot")' > /dev/null
          # e a fonte de dados do Grafana responde (consulta passando pelo Grafana até o Prometheus)
          curl -fs -u admin:admin "http://localhost:3001/api/datasources/proxy/uid/prometheus/api/v1/query?query=up" | jq -e '.status=="success"' > /dev/null
          echo "Grafana, painel e fonte de dados conferidos"

      - name: Guardar o relatório do navegador se algo falhou
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

      - name: Mostrar os logs se algo falhou
        if: failure()
        run: docker compose --profile observabilidade logs --no-color --tail=80

      - name: Desligar tudo
        if: always()
        run: docker compose --profile observabilidade down -v
