services:
  # 1. O Banco de Dados
  postgres-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=admin_iot
      - POSTGRES_PASSWORD=senha_nova_123
      - POSTGRES_DB=iot_plataforma
    volumes:
      - postgres-dados:/var/lib/postgresql/data # os dados sobrevivem a um "docker compose down"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_iot -d iot_plataforma"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. O Correio Central (RabbitMQ)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"   # Porta interna por onde os sistemas conversam
      - "15672:15672" # Painel visual para você acessar no navegador
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # 3. O Coração Java (API)
  iot-core:
    build: ./iot-core
    ports:
      - "8080:8080"
    environment:
      # Dentro do Docker, cada serviço é encontrado pelo nome (e não por "localhost")
      - DB_URL=jdbc:postgresql://postgres-db:5432/iot_plataforma
      - DB_USER=admin_iot
      - DB_PASS=senha_nova_123
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - JWT_SECRET=${JWT_SECRET:-MinhaChaveSuperSecretaParaAIndustriaIot2026!}
      # Token fixo para o Prometheus buscar as métricas (só vale em /actuator/prometheus e /actuator/metrics).
      # Valor de desenvolvimento; se mudar aqui, mude também em observabilidade/prometheus.yml.
      - METRICAS_TOKEN=${METRICAS_TOKEN:-metricas-local-dev}
    depends_on:
      postgres-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  # 4. O Mensageiro Node (Gateway)
  servidor-node:
    build: ./servidor-node
    ports:
      - "3000:3000"
    environment:
      - JWT_SECRET=${JWT_SECRET:-MinhaChaveSuperSecretaParaAIndustriaIot2026!}
      - RABBITMQ_URL=amqp://rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  # 5. O Simulador Python (envia as leituras para a API Java local)
  simulador-python:
    build: ./simulador-python
    environment:
      - JAVA_URL=http://iot-core:8080/api/sensores
    depends_on:
      - iot-core
    restart: on-failure

  # 6. A Interface React
  painel-react:
    build: ./painel-react
    ports:
      - "5173:5173"

  # 7 e 8. Métricas (só sobem com o perfil "observabilidade"):
  #   docker compose --profile observabilidade up -d
  # Prometheus: http://localhost:9090   Grafana: http://localhost:3001 (admin / admin, só para uso local)
  prometheus:
    image: prom/prometheus:v3.13.4
    profiles: ["observabilidade"]
    volumes:
      - ./observabilidade/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - iot-core
    restart: on-failure

  grafana:
    image: grafana/grafana:13.0
    profiles: ["observabilidade"]
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # Quem abre o endereço já vê o painel, sem login (só para uso local)
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/plataforma-iot.json
    volumes:
      - ./observabilidade/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidade/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: on-failure

volumes:
  postgres-dados:
