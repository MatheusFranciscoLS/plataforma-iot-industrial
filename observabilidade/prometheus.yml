# Prometheus do docker-compose: busca as métricas da API a cada 15 segundos.
# A rota /actuator/prometheus pede autorização; o compose usa o token de métricas de desenvolvimento
# (METRICAS_TOKEN, a mesma variável que a API lê). Se mudar um, mude o outro.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: iot-core
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials: metricas-local-dev
    static_configs:
      - targets: ["iot-core:8080"]
